name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Seuls les fichiers du site sont publiés : les documents internes,
      # sources des Workers et PDF restent dans le dépôt mais hors de qentina.fr.
      - name: Préparation du site public
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site' --exclude '.git' --exclude '.github' --exclude '.wrangler' \
            --exclude '*.md' --exclude '*.pdf' --exclude '*.sql' --exclude '*.toml' \
            --exclude 'worker*.js'
          ls -la _site

      - name: Téléversement du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
