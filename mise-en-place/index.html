<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mise en Place · QENTINA</title>
  <meta name="description" content="Checklists de mise en place du restaurant QENTINA." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f5460" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark">Q</span>
        <div class="brand__txt">
          <strong>Mise en Place</strong>
          <span>QENTINA · Louviers</span>
        </div>
      </div>
      <span class="today" id="today"></span>
    </header>

    <div class="staff-head">
      <div>
        <h1 class="view__title">Mise en place du jour</h1>
        <p class="view__sub" id="progress-txt">0 / 0 tâches réalisées</p>
      </div>
      <div class="staff-progress">
        <span class="staff-progress__pct" id="progress-pct">0 %</span>
        <div class="bar"><div class="bar__fill" id="progress-bar"></div></div>
      </div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="stations" id="stations"></div>

    <p class="empty" id="empty" hidden>Aucun poste n'a encore été configuré.<br />Demandez le lien à jour au responsable.</p>

    <footer class="foot">
      Cochez au fur et à mesure — la liste se remet à zéro chaque jour.<br />
      QENTINA · <a class="foot-link" href="admin.html">Espace responsable</a>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="staff.js"></script>
</body>
</html>
